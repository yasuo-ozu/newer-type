name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Tests (including the GAT-based ones) require Rust 1.65. A plain resolve on
  # 1.65 would pull in transitive crates that need a newer rustc (syn/quote/
  # unicode-ident declare rust-version 1.71), and 1.65 has no MSRV-aware
  # resolver. So the lockfile is resolved with `stable` honouring our declared
  # `rust-version`, then built with 1.65 against that pinned lockfile.
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install toolchains
      run: |
        rustup toolchain install 1.65.0 --profile minimal --component clippy
        rustup toolchain install stable --profile minimal
    - name: Resolve MSRV-compatible lockfile
      run: cargo +stable generate-lockfile
      env:
        CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    - name: Run clippy
      run: cargo +1.65.0 clippy --workspace --locked
    - name: Run tests for base crate
      run: cargo +1.65.0 test --locked
    - name: Run tests for std crate
      run: cargo +1.65.0 test --manifest-path std/Cargo.toml --locked

  # Verify the libraries still compile on the declared MSRV. Same resolution
  # strategy as above: resolve MSRV-compatible versions with `stable`, then
  # `cargo check` with 1.56 against the pinned lockfile.
  msrv:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install toolchains
      run: |
        rustup toolchain install 1.56.0 --profile minimal
        rustup toolchain install stable --profile minimal
    - name: Resolve MSRV-compatible lockfile
      run: cargo +stable generate-lockfile
      env:
        CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    - name: cargo check on MSRV (1.56.0)
      run: cargo +1.56.0 check --workspace --locked
