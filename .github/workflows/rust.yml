name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Tests (including the GAT-based ones) require Rust 1.65. A plain resolve on
  # 1.65 would pull in transitive crates that need a newer rustc (syn/quote/
  # unicode-ident declare rust-version 1.71), and 1.65 has no MSRV-aware
  # resolver. So the lockfile is resolved with `stable` honouring our declared
  # `rust-version`, then built with 1.65 against that pinned lockfile.
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install toolchains
      run: |
        rustup toolchain install 1.65.0 --profile minimal --component clippy
        rustup toolchain install stable --profile minimal
    - name: Resolve MSRV-compatible lockfile
      run: cargo +stable generate-lockfile
      env:
        CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    - name: Run clippy
      run: cargo +1.65.0 clippy --workspace --all-targets --locked
    - name: Run tests (base crate, the std traits of announce-std and the facade/renamed-dependency tests)
      run: cargo +1.65.0 test --workspace --locked

  # Targets and members that the jobs above and below do not cover. Recent
  # toolchains, and no pinned lockfile. The UI tests need nightly: their
  # snapshots were recorded with it (stable words some errors differently).
  extra:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install toolchains
      run: |
        rustup toolchain install stable --profile minimal --component clippy --target x86_64-unknown-none
        rustup toolchain install nightly --profile minimal
    - name: Build the no_std probe for a target without std
      # `announce` is used without its default feature `proc-macro-api`, so no
      # proc-macro2 or syn is built for the target. `-p` keeps the other members
      # out of the build. The tests of tests/nostd run in `cargo test --workspace`.
      run: cargo +stable build -p newer-type-test-nostd --target x86_64-unknown-none --verbose
    - name: Run the UI tests
      working-directory: tests/ui
      run: cargo +nightly test --verbose
    - name: Run clippy (all targets, warnings are errors)
      run: cargo +stable clippy --workspace --all-targets -- -D warnings
    - name: Build docs
      run: cargo +stable doc --no-deps --workspace --verbose
      env:
        RUSTDOCFLAGS: -D warnings

  # Verify the libraries still compile on the declared MSRV. Same resolution
  # strategy as above: resolve MSRV-compatible versions with `stable`, then
  # `cargo check` with 1.60, the declared `rust-version`, against the pinned
  # lockfile (announce itself needs 1.57).
  msrv:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install toolchains
      run: |
        rustup toolchain install 1.60.0 --profile minimal
        rustup toolchain install stable --profile minimal
    - name: Resolve MSRV-compatible lockfile
      run: cargo +stable generate-lockfile
      env:
        CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    - name: cargo check on MSRV (1.60.0)
      run: cargo +1.60.0 check --workspace --locked
