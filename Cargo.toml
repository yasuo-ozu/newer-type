[package]
name = "newer-type"
description = "Support defining newtype wrapper with inheriting trait implementations"
authors = ["Yasuo Ozu <yasuo@ozu.email>"]
version = "0.5.0"
repository = "https://github.com/yasuo-ozu/newer-type"
edition = "2021"
license = "MIT"
rust-version = "1.60"
homepage = "https://github.com/yasuo-ozu/newer-type"
keywords = ["newtype", "trait", "proc-macro", "attribute-macro"]
categories = ["rust-patterns", "data-structures", "no-std"]
# The root of the repository is this crate and the workspace: publish only the
# crate itself (lib.rs includes README.md as its documentation), not the tests
# (some are their own packages), the CI configuration or rustfmt.toml.
include = ["lib.rs", "README.md", "CHANGELOG.md", "LICENSE", "Cargo.toml"]


[lib]
path = "lib.rs"

[dependencies]
newer-type-macro = { path = "macro", version = "0.5.0" }
# `#[announce]` and `define_repeater!` need only the definer side of announce on
# the target. Its default feature `proc-macro-api` (syn, proc-macro2, type-leak,
# for proc-macro crates) would break `#![no_std]` users and targets without std,
# so it stays off here; newer-type-macro runs on the host and turns it on for
# itself (this needs cargo's resolver 2, the default of edition 2021).
announce = { version = "0.2.0", default-features = false }

[dev-dependencies]
# The std traits for the tests: `#[implement(::announce_std::fmt::Display)]`.
announce-std = "0.2.0"

[features]
default = ["std"]
std = []

[workspace]
members = [".", "macro", "tests/facade", "tests/facade-user", "tests/renamed", "tests/nostd"]
# `tests/ui` needs a newer rustc (trybuild).
exclude = ["tests/ui"]
resolver = "2"
